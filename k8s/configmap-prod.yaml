apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: profiller
data:
  # Environment
  NODE_ENV: "production"

  # Ports
  PORT_FRONTEND: "3000"
  PORT_BACKEND: "3001"
  PORT_MCP: "3002"
  HOSTNAME: "0.0.0.0"

  # Feature Flags
  NEXT_TELEMETRY_DISABLED: "1"

  # Internal Service URLs (production uses internal DNS)
  API_URL: "http://backend-service:3001"

  # CORS (production domain)
  CORS_ORIGIN: "https://profiller.com"
  ALLOWED_ORIGINS: "https://profiller.com,https://api.profiller.com,https://www.profiller.com"

  # Database
  POSTGRES_DB: "profiller_prod"
  POSTGRES_USER: "postgres"

  # Logging
  LOG_LEVEL: "warn"

  # Node Options
  NODE_OPTIONS: "--max-old-space-size=2048"

  # JWT
  JWT_EXPIRES_IN: "7d"
