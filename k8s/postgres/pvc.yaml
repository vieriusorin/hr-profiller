apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: profiller
  labels:
    app: postgres
    component: database
spec:
  accessModes:
    - ReadWriteOnce  # Only one node can mount read-write
  resources:
    requests:
      storage: 10Gi  # Request 10GB of storage
  # storageClassName: standard  # Uncomment and set for specific storage class
  # For Minikube, it will use the default 'standard' storage class automatically
  # For cloud providers:
  #   - AWS: gp2, gp3, io1
  #   - GCP: standard, pd-ssd
  #   - Azure: default, managed-premium
