apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: profiller-staging

# Add PVC for staging
resources:
  - ../../postgres/pvc-staging.yaml

commonLabels:
  environment: staging

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
      - POSTGRES_DB=profiller_staging
      - CORS_ORIGIN=https://staging.profiller.com
      - ALLOWED_ORIGINS=https://staging.profiller.com,https://staging-api.profiller.com
      - NODE_OPTIONS=--max-old-space-size=1024

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 2
        template:
          spec:
            containers:
            - name: backend
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 2
        template:
          spec:
            containers:
            - name: frontend
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-server
      spec:
        replicas: 1
        template:
          spec:
            containers:
            - name: mcp-server
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
