apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: profiller

# Add PVC for production
resources:
  - ../../postgres/pvc-prod.yaml

commonLabels:
  environment: production

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - POSTGRES_DB=profiller_prod
      - CORS_ORIGIN=https://profiller.com
      - ALLOWED_ORIGINS=https://profiller.com,https://api.profiller.com,https://www.profiller.com
      - NODE_OPTIONS=--max-old-space-size=2048

patches:
  # Production has higher resources and replicas
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 3
        template:
          spec:
            containers:
            - name: backend
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "1000m"
                limits:
                  memory: "2Gi"
                  cpu: "2000m"

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 3
        template:
          spec:
            containers:
            - name: frontend
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "1000m"
                limits:
                  memory: "2Gi"
                  cpu: "2000m"

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-server
      spec:
        replicas: 2
        template:
          spec:
            containers:
            - name: mcp-server
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"

  # Production uses persistent storage
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres
      spec:
        template:
          spec:
            volumes:
            - name: postgres-storage
              persistentVolumeClaim:
                claimName: postgres-pvc
